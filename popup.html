<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overlay Toggle</title>
    <link rel = "stylesheet" href="styles.css">
</head>
<body>
    <header>Seia Singer</header>
    <img class ="seiagif "src="seia-yurizono-seia.gif">
    <div class="command">
        <span style="display: block; text-align: center;">Use Control(or CMD) + Shift + S to start audio capture</span>
        <div class="threshold">
        <label for="thresholdInput" style="color:aliceblue; font-size: 15px;">Volume threshold (dB)</label>
        <input type="number" id="thresholdInput" placeholder="-35" step="1">
    </div>
    </div>

    <div class="footer">
        <div class="profile">
            <img src="popup/profile.png" alt="Profile Picture">
            <span >Created by chikenuwu</span>
        </div>
    </div>
    <div class="icons">
        
        <a href="https://ko-fi.com/chikenuwu" target="_blank">
            <img src="popup/kofi.webp" alt="Ko-fi">
        </a>
        <a href="https://www.youtube.com/@chikenuwu" target="_blank">
            <img src="popup/youtube.png" alt="YouTube">
        </a>
        <a href="https://x.com/Chikenqwq" target="_blank">
            <img src="popup/twitter.png" alt="Twitter">
        </a>
        <a href="https://github.com/chikenuwu/SeiaSinger" target="_blank">
            <img src="popup/github.png" alt="Github">
        </a>
    </div>
    <footer>v1.0</footer>

    <script src="popup.js"></script>
</body>
</html>
