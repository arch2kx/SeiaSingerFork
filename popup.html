<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Overlay Toggle</title>

  <!-- CSS -->
  <link rel = "stylesheet" href="styles.css">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
  <!-- The Header basically -->
  <img src="popup/seia-singer.png" class="logo-banner">
  <img class ="seiagif"src="seia-yurizono-seia.gif">
  <div class="command">
      <span style="display: block; text-align: center;">Use CTRL (or CMD) + Shift + L to start audio capturing</span>
      <div class="threshold">
      <label for="thresholdInput" style="color:aliceblue; font-size: 15px;">Volume threshold (dB)</label>
      <input type="number" id="thresholdInput" placeholder="-35" step="1">
  </div>
  </div>

  <div class="toggle-row">
    <label class="switch">
      <input type="checkbox" id="seiaToggle" checked>
      <span class="slider"></span>
    </label>
    <span class="toggle-label">Show Seia</span>
  </div>

  <div class="size-row">
    <div class="slider-track-clip">
      <div class="slider-fill" id="seiaSizeFill"></div>
      <input type="range" id="seiaSizeSlider" min="0" max="4" step="1" value="2">
    </div>
    <span class="toggle-label">Seia size</span>
  </div>

  <div class="footer">
      <div class="profile">
          <img src="popup/arch2kx-pfp.png" alt="Arch Profile Picture">
          <span>Fork by arch2kx</span>
          <img src="popup/profile.png" alt="Profile Picture">
          <span >Original by chikenuwu</span>
      </div>
  </div>
  <div class="icons">
      <a href="https://github.com/arch2kx/Yet-Another-Sechify-Fork" target="_blank" rel="noopener">
          <img src="popup/github.png" alt="Github">
      </a>
      <a href="https://www.youtube.com/@YourLocalKoyuki" target="_blank" rel="noopener">
          <img src="popup/youtube.png" alt="YouTube">
      </a>
      <a href="https://ko-fi.com/archkun" target="_blank" rel="noopener">
          <img src="popup/kofi.png" alt="Ko-fi">
      </a>
  </div>
  <footer>v1.1</footer>

  <script src="popup.js"></script>
</body>
</html>
